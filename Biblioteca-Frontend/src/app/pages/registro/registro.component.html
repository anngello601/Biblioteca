<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow-lg border-0" style="width: 100%; max-width: 450px;">
    <div class="card-body p-5">
      <h2 class="text-center mb-4"><i class="fas fa-user-plus me-2"></i>Registro</h2>
      @if (error) {
        <div class="alert alert-danger">{{ error }}</div>
      }
      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label"><i class="fas fa-user me-1"></i> Nombre completo</label>
          <input type="text" class="form-control" [(ngModel)]="usuario.nombre" name="nombre" required placeholder="Tu nombre">
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="fas fa-envelope me-1"></i> Email</label>
          <input type="email" class="form-control" [(ngModel)]="usuario.email" name="email" required placeholder="correo@ejemplo.com">
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="fas fa-lock me-1"></i> Contraseña</label>
          <input type="password" class="form-control" [(ngModel)]="usuario.password" name="password" required placeholder="Mínimo 6 caracteres" minlength="6">
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="fas fa-check-circle me-1"></i> Confirmar contraseña</label>
          <input type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" required placeholder="Repite la contraseña">
        </div>
        <button type="submit" class="btn btn-success w-100 py-2" [disabled]="loading">
          @if (loading) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          {{ loading ? 'Registrando...' : 'Registrarse' }}
        </button>
      </form>
      <p class="mt-3 text-center">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </div>
  </div>
</div>
