<div class="container py-5" style="max-width: 600px;">
  <div class="card shadow-lg border-0">
    <div class="card-body p-5 text-center">
      <i class="fas fa-clipboard-check fa-4x text-primary mb-4"></i>
      <h2 class="mb-3">Confirmar compra</h2>
      <p class="text-muted mb-4">Revisa tu carrito antes de confirmar. Una vez confirmada, no podrás deshacer la operación.</p>
      <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
        <button class="btn btn-success btn-lg" (click)="confirmar()">
          <i class="fas fa-check-circle me-2"></i> Sí, comprar
        </button>
        <a routerLink="/carrito" class="btn btn-outline-secondary btn-lg">
          <i class="fas fa-arrow-left me-1"></i> Volver al carrito
        </a>
      </div>
    </div>
  </div>
</div>
