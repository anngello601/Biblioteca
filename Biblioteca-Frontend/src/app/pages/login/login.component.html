<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow-lg border-0" style="width: 100%; max-width: 400px;">
    <div class="card-body p-5">
      <h2 class="text-center mb-4"><i class="fas fa-user-lock me-2"></i>Iniciar sesión</h2>
      @if (mensajeRegistro) {
        <div class="alert alert-success">{{ mensajeRegistro }}</div>
      }
      @if (error) {
        <div class="alert alert-danger">{{ error }}</div>
      }
      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label"><i class="fas fa-envelope me-1"></i> Email</label>
          <input type="email" class="form-control" [(ngModel)]="email" name="email" required placeholder="correo@ejemplo.com">
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="fas fa-lock me-1"></i> Contraseña</label>
          <input type="password" class="form-control" [(ngModel)]="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">
          <i class="fas fa-sign-in-alt me-2"></i> Ingresar
        </button>
      </form>
      <p class="mt-3 text-center">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
    </div>
  </div>
</div>
